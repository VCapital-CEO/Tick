name: tests
on: [push, pull_request]
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd worker && npm install && npm test
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd ui-test && npm install && npm test
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pgserver psycopg2-binary
      - run: python3 supabase/tests/run.py
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: {deno-version: v2.x}
      - run: |
          echo '{"imports":{"https://esm.sh/@supabase/supabase-js@2.45.4":"npm:@supabase/supabase-js@2.45.4"}}' > /tmp/map.json
          deno check --import-map=/tmp/map.json supabase/functions/*/index.ts
          deno test supabase/functions/_shared/fingerprint.test.ts
          deno test --import-map=supabase/functions/_tests/import_map.json --allow-env supabase/functions/_tests/money.test.ts